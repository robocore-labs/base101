# base101 REAL HARDWARE profile: mobility + sensing + slam (armless).
#
# Matches `ros2 launch base101_bringup_hw robot.launch.py` (arm:=false is
# the only supported value — base101_bringup_hw raises on arm:=true, see
# base101_arm_hw.yaml). The sim counterpart is base101.yaml; the arm-bearing
# hardware counterpart is base101_arm_hw.yaml (arm declared but NOT YET
# DRIVABLE — see that file).
#
# Values below are read off HARDWARE.md's topic contract and the *.hw.yaml
# configs (base101_control/config/ekf.hw.yaml, base101_lidar), current as of
# the Axon 2 rewrite (2026-09 — "moving locomotion to fw" / "changed to
# realsense"). base101_arm_hw.yaml predates that rewrite in three places
# that silently went stale (wrong topic, not missing — nothing errors, the
# call just blocks until it times out):
#
#   mobility.odom_topic  was /diff_drive_controller/odom -> there is no
#     diff_drive_controller on hardware; the host EKF is the sole publisher
#     of odom -> base_link and /odom (HARDWARE.md "Host-side fused
#     odometry"; ekf.hw.yaml remaps odometry/filtered -> /odom).
#   lidar.scan            was /scan -> base101_lidar republishes the
#     self-filtered scan on /scan_filtered; base101_slam/base101_nav are
#     wired to that name, not /scan (base101_lidar/README.md).
#   imu.topic              was /imu/data (a stale "BNO055" reference) ->
#     the firmware publishes /link101/imu, frame imu_link (HARDWARE.md
#     topic contract). All firmware topics live under /link101/; nothing
#     publishes plain /cmd_vel, /odom or /imu/* directly.
#
# Fixed here; base101_arm_hw.yaml should get the same correction next time
# it's touched.
name: base101
model: base101 (chassis only, hardware)
version: "0"
protocol: 1

frames:
  map: map
  odom: odom
  base: base_link

mobility:
  locomotion: differential          # 4WD skid steer presents as diff drive
  cmd_vel: /cmd_vel_agent           # twist_mux input, priority 50
  cmd_vel_stamped: true             # Jazzy twist_mux (use_stamped) wants TwistStamped
  # The one and only publisher of odom -> base_link / /odom on hardware is
  # the host EKF (base101_control/config/ekf.hw.yaml); there is no
  # diff_drive_controller here, unlike sim.
  odom_topic: /odom
  nav2_navigate_to_pose: /navigate_to_pose
  # No nav2_follow_waypoints: base101_nav launches no waypoint_follower.
  max_linear: 0.5                   # m/s, measured: DDSM210 rated-speed reality
  max_angular: 1.5                  # rad/s safety clamp

# Intel RealSense D415 on the front bracket (camera:=realsense), driven by
# base101_camera. See base101_arm_hw.yaml for the frame-name derivation
# (realsense2_camera's OPTICAL_FRAME_ID macro) — identical here, the camera
# doesn't move when the arm does.
cameras:
  base:
    rgb: /camera/color/image_raw
    depth: /camera/aligned_depth_to_color/image_raw
    info: /camera/color/camera_info
    frame: camera_color_optical_frame
    optical: true                   # REQUIRED — without it deproject/get_cloud
                                    # come out 90 degrees wrong with no error

lidar:
  scan: /scan_filtered              # RPLidar C1, self-hits stripped, frame lidar_frame

imu:
  topic: /link101/imu               # Axon 2 firmware, frame imu_link, 50 Hz.
                                    # Also /link101/imu/mag, /link101/imu/temperature.

slam:
  backend: slam_toolbox
  map_dir: ~/.robocore/maps

# No exploration section — see base101.yaml.

teleop:
  max_watchdog: 1.0                 # seconds; clients may request shorter, never longer

audit:
  retention_mb: 200

watches: {}                         # dotted-path condition monitors

places: {}                          # named poses, stored per-map


# No `status.battery`: the Axon 2 topic contract (HARDWARE.md) has no BMS
# topic yet. Declaring one would advertise a battery capability that never
# produces a reading — add it here when the BMS lands.

safety:
  stop_on_disconnect: true
  confirm_required: []

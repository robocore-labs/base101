[workspace]
name = "base101"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
[dependencies]
python = "3.12.*"
[tasks]
setup = "python scripts/robot.py setup"
doctor = "python scripts/robot.py doctor"
images = "python scripts/robot.py images"
up = "python scripts/robot.py up"
down = "python scripts/robot.py down"
restart = "python scripts/robot.py restart"
status = "python scripts/robot.py status"
logs = "python scripts/robot.py logs"
build = "python scripts/robot.py build"
exec = "python scripts/robot.py exec"
sim = "python scripts/sim.py"
sim-stop = "python scripts/robot.py sim-stop"
test = "python scripts/robot.py test"
dashboard = "python scripts/robot.py dashboard"
check-rendering = "python scripts/robot.py check-rendering"
teleop = "python scripts/robot.py teleop"
view = "pixi run -e viewer view-native"
view-native = "python scripts/robot.py view"
balena-prepare = "python scripts/balena.py prepare"
balena-build = "python scripts/balena.py build"
balena-deploy = "python scripts/balena.py deploy"
balena-push = "python scripts/balena.py deploy"
balena-devices = "python scripts/balena.py devices"
balena-logs = "python scripts/balena.py logs"
balena-ssh = "python scripts/balena.py ssh"
[feature.viewer.pypi-dependencies]
mujoco = "==3.13.0"
numpy = "==1.26.4"
[environments]
default = []
viewer = ["viewer"]
[tool.multiros]
schema = 1
project = "base101"
compose = ["docker-compose.yml"]
service = "ros-dev"
entrypoint = ["/usr/local/bin/base101-entrypoint"]
submodules = ["tools/multiros", "dependencies/mod101"]
rendering_base = true
default_configuration = "arm"
configurations = ["base", "arm"]
[tool.multiros.backends]
lighter = ["{multiros}/docker/compose/lighter.yml", "docker/compose.lighter.yml"]
dri = ["{multiros}/docker/compose/dri.yml"]
cpu = ["{multiros}/docker/compose/cpu.yml"]
wsl = ["{multiros}/docker/compose/wsl.yml"]
[tool.multiros.viewer]
runtime = ".runtime"
args = ["--model", ".runtime/scene.mjb", "--track-body", "base_link", "--show-group", "2", "--hide-group", "3", "--kinematics-only"]
[tool.multiros.container]
dockerfile = "docker/Dockerfile.sim"
workdir = "/workspace/base101"
gpu = true
mounts = [{source = "{root}", target = "/workspace/base101"}, {type = "volume", source = "base101-build", target = "/workspace/base101/build"}, {type = "volume", source = "base101-install", target = "/workspace/base101/install"}, {type = "volume", source = "base101-log", target = "/workspace/base101/log"}]
ports = ["127.0.0.1:8890:8888"]
[tool.multiros.container.image]
default = "base101:jazzy"
lighter = "base101:jazzy-lighter"
[tool.multiros.container.environment]
ROS_DOMAIN_ID = "187"
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
MUJOCO_GL = "egl"
EGL_PLATFORM = "surfaceless"
PYTHONPATH = "/workspace/base101/src/base101/base101_mujoco:/opt/base101-python/lib/python3.12/site-packages"
[tool.multiros.workspace]
paths = ["src", "dependencies/mod101/src"]
packages = ["base101_description", "base101_control", "base101_sim_control", "base101_mujoco", "base101_lidar", "base101_nav", "base101_slam", "robocore_viz"]
workers = 2
cmake_args = ["-DPython3_EXECUTABLE=/usr/bin/python3", "-DBUILD_TESTING=OFF"]
[tool.multiros.commands.sim]
where = "container"
argv = ["bash", "scripts/run_sim.sh", "{configuration}"]
[tool.multiros.commands.sim-stop]
where = "container"
argv = ["python3", "scripts/stop_sim.py"]
[tool.multiros.commands.test]
where = "container"
argv = ["python3", "checks/check_sim.py"]
[tool.multiros.commands.check-rendering]
where = "container"
argv = ["python3", "tools/multiros/checks/check_rendering.py"]
[tool.multiros.commands.dashboard]
where = "host"
argv = ["python3", "-m", "webbrowser", "http://localhost:8890"]
[tool.multiros.commands.teleop]
where = "container"
argv = ["ros2", "run", "teleop_twist_keyboard", "teleop_twist_keyboard", "--ros-args", "-p", "stamped:=true", "-p", "use_sim_time:=true", "-r", "cmd_vel:=/cmd_vel_key"]
interactive = true

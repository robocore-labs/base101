# RoboStack / pixi environment for the base101 workspace — sim only.
#
#   curl -fsSL https://pixi.sh/install.sh | bash      # one-time, if you don't have pixi
#   pixi install                                      # solve + fetch ROS 2 Jazzy
#   pixi run build                                    # colcon build
#   pixi shell                                         # drop into the env (workspace overlaid)
#   pixi run sim                                        # Gazebo:  base101_bringup_sim gazebo.launch.py
#   pixi run -e mujoco mujoco-sim                       # MuJoCo:  base101_bringup_sim mujoco.launch.py
#
# Two environments, one per simulator: `default` (Gazebo) and `mujoco`. The
# arm is a launch argument in both (`pixi run sim arm:=true`), not an
# environment; it needs the mod101 underlay (see PIXI.md).
#
# This is a self-contained ROS 2 Jazzy from the RoboStack conda channel — it does
# NOT use /opt/ros. Never `source /opt/ros/jazzy/setup.bash` inside `pixi shell`;
# the mixed PYTHONPATH breaks both. Close other ROS terminals before `pixi shell`.
#
# base101_arm_moveit_config is skipped in every environment (see [tasks].build)
# — no MoveIt here on purpose, arm:=true only gets ros2_control (position/
# trajectory controllers) — and that package needs moveit_ros_move_group/
# moveit_planners_ompl/etc., which this file deliberately doesn't install.
#
# See https://robostack.github.io/GettingStarted.html and this repo's PIXI.md.

[workspace]                       # older pixi (<0.40): rename this table to [project]
name = "base101"
description = "base101 mobile base - ROS 2 Jazzy workspace (sim)"
channels = [
  "https://prefix.dev/robostack-jazzy",
  "https://prefix.dev/conda-forge",
]
platforms = ["osx-arm64"]

# Overlay the colcon workspace on every `pixi shell` / `pixi run`, once it
# exists — and mod101's own pixi-built install too, if present (see PIXI.md).
[activation]
scripts = ["pixi/activate.sh"]

# --- runtime: description, ros2_control, Gazebo, nav2/slam, rosboard --------
[dependencies]
python = ">=3.11"
pip = "*"
setuptools = "<80.0.0"
tornado = "*"                                  # rosboard (src/rosboard, vendored, not a RoboStack package)
pillow = "*"                                   # rosboard

ros-jazzy-desktop = "*"                        # rviz2, robot_state_publisher, joint_state_publisher(_gui), tf, ...
ros-jazzy-xacro = "*"
ros-jazzy-pluginlib = "*"

ros-jazzy-ros2-control = "*"                   # controller_manager, hardware_interface, mock_components
ros-jazzy-ros2-controllers = "*"              # joint_state_broadcaster, joint_trajectory_controller, position_controllers
ros-jazzy-diff-drive-controller = "*"         # NOT in the ros2_controllers metapackage — base101's wheels need it explicitly
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-twist-mux = "*"
ros-jazzy-laser-filters = "*"                  # gazebo.launch.py's scan_filter node — not in base101_bringup_sim's
                                                # own package.xml (launch-time dep only), easy to miss from that alone

ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-ros-gz-image = "*"

ros-jazzy-robot-localization = "*"             # EKF, base101_slam
ros-jazzy-slam-toolbox = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-nav2-bringup = "*"                   # pulls in nav2_planner/controller/bt_navigator/... base101_nav uses directly

# --- build toolchain ---------------------------------------------------------
# `[build-dependencies]` is deprecated (older pixi split build vs. runtime
# deps into two tables; current pixi just wants them together in
# `[dependencies]`, same solve either way here).
c-compiler = "*"
cxx-compiler = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
colcon-common-extensions = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-cmake-python = "*"
ros-jazzy-ament-lint-auto = "*"
ros-jazzy-ament-lint-common = "*"
pytest = "*"

[tasks]
# --packages-skip base101_arm_moveit_config, in every environment: it needs
# MoveIt (moveit_ros_move_group, moveit_planners_ompl, ...), which this file
# doesn't install anywhere — arm:=true gets ros2_control only (see the
# header comment). Not feature-gated: nothing here ever wants this package.
build = "colcon build --symlink-install --packages-skip base101_arm_moveit_config --event-handlers console_direct+ --cmake-args -DCMAKE_VERBOSE_MAKEFILE=ON"
test = { cmd = "colcon test && colcon test-result --verbose", depends-on = ["build"] }
clean = "rm -rf build install log"
# agent:=false: robocore_agent isn't vendored in this workspace (see
# base101_bringup_sim/package.xml's exec_depend on it) — the launchers'
# default is agent:=true, which would fail to find the executable. Extra
# launch args go after the task name: `pixi run sim arm:=true`.
sim = "ros2 launch base101_bringup_sim gazebo.launch.py agent:=false"
# One definition shared by every environment, so a bare `pixi run stop` works
# whichever one you launched from. See pixi/stop.sh.
stop = "bash pixi/stop.sh"

[environments]
# `pixi shell`           -> Gazebo
# `pixi shell -e mujoco` -> MuJoCo (mujoco_ros2_control; one-time
#                           `pixi run -e mujoco mujoco-setup` first)
# arm:=true works in both; it needs the mod101 underlay (see PIXI.md).
default = { features = [], solve-group = "main" }
mujoco = { features = ["mujoco"], solve-group = "main" }

# --- feature: MuJoCo (see mujoco.md, ../mod101/mujoco.md, docs/macos.md) ----
# Same pins as mod101's mujoco environment — they share the MJCF tooling
# (mod101_mujoco, from the mod101 underlay) and must agree on MuJoCo.
[feature.mujoco.dependencies]
# libmujoco from RoboStack's vendor package; 0.0.9 (MuJoCo 3.10) does not
# co-solve with this ROS env. Python bindings from the PyPI wheel below,
# pinned to the SAME version so generated MJCF loads in the C++ sim.
ros-jazzy-mujoco-vendor = "==0.0.8"   # -> libmujoco 3.8.1
glfw = ">=3.4,<4"
# mujoco_ros2_control has no osx-arm64 RoboStack build -> built from source
# (mujoco-setup); these are its build deps not already in [dependencies].
ros-jazzy-control-toolbox = "*"
ros-jazzy-backward-ros = "*"
ros-jazzy-transmission-interface = "*"
ros-jazzy-realtime-tools = "*"
ros-jazzy-ros2-control-cmake = "*"
ros-jazzy-tinyxml2-vendor = "*"
ros-jazzy-urdfdom-py = "*"
ros-jazzy-python-orocos-kdl-vendor = "*"
ros-jazzy-imu-sensor-broadcaster = "*"   # /sensors/imu from the MuJoCo IMU
fmt = "*"
eigen = "*"
scipy = "*"                              # trimesh convex hulls (MJCF converter)

[feature.mujoco.pypi-dependencies]
mujoco = "==3.8.1"   # MUST match the vendor's libmujoco
coacd = ">=1.0.14"   # convex decomposition of concave collision meshes
trimesh = "*"

[feature.mujoco.tasks]
# Builds mujoco_ros2_control from the fork checkout next to this repo
# (../mujoco_ros2_control, branch macos-support) into .mujoco_ws/.
mujoco-setup = "bash pixi/mujoco_setup.sh"
mujoco-sim = "ros2 launch base101_bringup_sim mujoco.launch.py agent:=false"
# Viewer for the headless sim (macOS: GLFW windows only on the main thread,
# hence mjpython). Lives in mod101 for now.
mujoco-view = "mjpython ../mod101/tools/mujoco/mirror_viewer.py"

# RoboStack / pixi environment for the base101 workspace — sim only.
#
#   curl -fsSL https://pixi.sh/install.sh | bash      # one-time, if you don't have pixi
#   pixi install                                      # solve + fetch ROS 2 Jazzy
#   pixi run build                                    # colcon build (armless — see below)
#   pixi shell                                         # drop into the env (workspace overlaid)
#   pixi run sim                                        # ros2 launch base101_bringup_gazebo sim.launch.py
#
# `build`/`test`/`clean`/`stop` are identical in every environment, so a bare
# `pixi run <task>` resolves fine for those. `sim` is the one task
# `[feature.arm.tasks]` actually overrides (arm:=true vs arm:=false) — pixi
# treats THAT as ambiguous for a bare `pixi run sim` and refuses to guess,
# even though one environment is literally named "default". Pass `-e default`
# or `-e arm` for `sim` specifically.
#
# This is a self-contained ROS 2 Jazzy from the RoboStack conda channel — it does
# NOT use /opt/ros. Never `source /opt/ros/jazzy/setup.bash` inside `pixi shell`;
# the mixed PYTHONPATH breaks both. Close other ROS terminals before `pixi shell`.
#
# base101_arm_moveit_config is skipped in every environment (see [tasks].build)
# — no MoveIt here on purpose, arm:=true only gets ros2_control (position/
# trajectory controllers via base101_control_plugin/mock, see
# base101_arm.hardware.xacro) — and that package needs moveit_ros_move_group/
# moveit_planners_ompl/etc., which this file deliberately doesn't install.
# `-e arm` only changes which sim.launch.py arg it passes (arm:=true) — see
# PIXI.md for the mod101 underlay build order arm:=true still needs.
#
# See https://robostack.github.io/GettingStarted.html and this repo's PIXI.md.

[workspace]                       # older pixi (<0.40): rename this table to [project]
name = "base101"
description = "base101 mobile base - ROS 2 Jazzy workspace (sim)"
channels = [
  "https://prefix.dev/robostack-jazzy",
  "https://prefix.dev/conda-forge",
]
platforms = ["osx-arm64"]

# Overlay the colcon workspace on every `pixi shell` / `pixi run`, once it
# exists — and mod101's own pixi-built install too, if present (see PIXI.md).
[activation]
scripts = ["pixi/activate.sh"]

# --- runtime: description, ros2_control, Gazebo, nav2/slam, rosboard --------
[dependencies]
python = ">=3.11"
pip = "*"
setuptools = "<80.0.0"
tornado = "*"                                  # rosboard (src/rosboard, vendored, not a RoboStack package)
pillow = "*"                                   # rosboard

ros-jazzy-desktop = "*"                        # rviz2, robot_state_publisher, joint_state_publisher(_gui), tf, ...
ros-jazzy-xacro = "*"
ros-jazzy-pluginlib = "*"

ros-jazzy-ros2-control = "*"                   # controller_manager, hardware_interface, mock_components
ros-jazzy-ros2-controllers = "*"              # joint_state_broadcaster, joint_trajectory_controller, position_controllers
ros-jazzy-diff-drive-controller = "*"         # NOT in the ros2_controllers metapackage — base101's wheels need it explicitly
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-twist-mux = "*"
ros-jazzy-laser-filters = "*"                  # sim.launch.py's scan_filter node — not in base101_bringup_gazebo's
                                                # own package.xml (launch-time dep only), easy to miss from that alone

ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-ros-gz-image = "*"

ros-jazzy-robot-localization = "*"             # EKF, base101_slam
ros-jazzy-slam-toolbox = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-nav2-bringup = "*"                   # pulls in nav2_planner/controller/bt_navigator/... base101_nav uses directly

# --- build toolchain ---------------------------------------------------------
# `[build-dependencies]` is deprecated (older pixi split build vs. runtime
# deps into two tables; current pixi just wants them together in
# `[dependencies]`, same solve either way here).
c-compiler = "*"
cxx-compiler = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
colcon-common-extensions = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-cmake-python = "*"
ros-jazzy-ament-lint-auto = "*"
ros-jazzy-ament-lint-common = "*"
pytest = "*"

[tasks]
# --packages-skip base101_arm_moveit_config, in every environment: it needs
# MoveIt (moveit_ros_move_group, moveit_planners_ompl, ...), which this file
# doesn't install anywhere — arm:=true gets ros2_control only (see the
# header comment). Not feature-gated: nothing here ever wants this package.
build = "colcon build --symlink-install --packages-skip base101_arm_moveit_config --event-handlers console_direct+ --cmake-args -DCMAKE_VERBOSE_MAKEFILE=ON"
test = { cmd = "colcon test && colcon test-result --verbose", depends-on = ["build"] }
clean = "rm -rf build install log"
# agent:=false: robocore_agent isn't vendored in this workspace (see
# base101_bringup_gazebo/package.xml's exec_depend on it) — sim.launch.py's
# default is agent:=true, which would fail to find the executable. Add
# `-- agent:=true` yourself once it's built/sourced.
sim = "ros2 launch base101_bringup_gazebo sim.launch.py agent:=false"
# Not overridden in [feature.arm.tasks] on purpose: one definition, shared
# by every environment, so a bare `pixi run stop` works regardless of which
# `-e` you launched with — no need to remember or guess. See pixi/stop.sh.
stop = "bash pixi/stop.sh"

[environments]
# `pixi shell`         -> armless sim
# `pixi shell -e arm`  -> sim with arm:=true (ros2_control only, no MoveIt —
#                         see header). Same dependencies as default; build
#                         mod101 with ITS OWN pixi env first and source its
#                         install/ (see PIXI.md) — this env doesn't vendor
#                         or build mod101 itself. No [feature.arm.dependencies]
#                         table: there's nothing this environment needs that
#                         `default` doesn't already have.
default = { features = [], solve-group = "main" }
arm = { features = ["arm"], solve-group = "main" }

# --- feature: arm:=true in sim, ros2_control only, no MoveIt ----------------
# Only overrides `sim` — `build`/`test`/`clean`/`stop` are identical to
# `default`'s, so they're not redeclared here (features inherit whatever
# [tasks] doesn't override).
[feature.arm.tasks]
sim = "ros2 launch base101_bringup_gazebo sim.launch.py agent:=false arm:=true"

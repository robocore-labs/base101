# Behavior Tree Navigator Configuration for base101 robot — real hardware.
# Sibling of bt_navigator.sim.yaml; only odom_topic differs (see below).

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    # The host-side EKF (base101_bringup_hw/launch/robot.launch.py, fusing
    # /link101/odom/raw + /link101/imu) publishes /odom — there's no
    # diff_drive_controller on hardware, and the firmware itself only
    # exposes raw, unfused odometry. See HARDWARE.md's topic contract.
    odom_topic: /odom
    transform_tolerance: 0.1

    # Navigator plugins (Jazzy format)
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    # BT file locations (relative to package share)
    default_nav_to_pose_bt_xml: nav_to_pose.xml
    default_nav_through_poses_bt_xml: nav_through_poses.xml

    # Goal blackboard ID
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path

    # Error code names - must match BT xml error_code_id values
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

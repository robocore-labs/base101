# Twist multiplexer for /cmd_vel sources.
#
# Input topics are subscribed as plain geometry_msgs/Twist (twist_mux's
# VelocityTopicHandle is hardcoded to that type). The cmd_vel_out remap (set
# in the launch) wires the output to the downstream consumer.
#
# use_stamped:true below is the sim default: diff_drive_controller on Jazzy
# is TwistStamped-only (the old use_stamped_vel toggle was removed), and
# sim.launch.py remaps cmd_vel_out to /diff_drive_controller/cmd_vel.
#
# base101_bringup_hw overrides use_stamped to false at the Node() level
# (without editing this file) because there is no diff_drive_controller on
# real hardware — the Axon 2 firmware subscribes to plain Twist on /cmd_vel.
twist_mux:
  ros__parameters:
    use_stamped: true
    topics:
      navigation:
        topic:    /cmd_vel_nav
        timeout:  0.5
        priority: 10
      # robocore agent (teleop/direct velocity). Above navigation so agent
      # teleop overrides autonomous motion, below joystick/keyboard so a
      # local operator always wins. The agent's own safety layer (watchdog,
      # clamps, e-stop) sits upstream of this topic.
      agent:
        topic:    /cmd_vel_agent
        timeout:  0.5
        priority: 50
      joystick:
        topic:    /cmd_vel_joy
        timeout:  0.5
        priority: 100
      keyboard:
        topic:    /cmd_vel_key
        timeout:  0.5
        priority: 90

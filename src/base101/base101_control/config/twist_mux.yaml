# Twist multiplexer for /cmd_vel sources.
#
# use_stamped:true makes twist_mux subscribe its input topics (cmd_vel_joy,
# cmd_vel_key, etc.) AND publish its output as TwistStamped (confirmed
# empirically on Jazzy — it's not just the output path). The cmd_vel_out
# remap (set in the launch) wires the output to /diff_drive_controller/cmd_vel
# in sim, or straight to /link101/cmd_vel (the Axon 2 firmware) on hardware —
# both downstreams take TwistStamped, so this applies unchanged on both.
#
# Leave this on unless you intentionally point twist_mux at a different
# downstream that takes unstamped Twist end-to-end (inputs included).
twist_mux:
  ros__parameters:
    use_stamped: true
    topics:
      navigation:
        topic:    /cmd_vel_nav
        timeout:  0.5
        priority: 10
      # robocore agent (teleop/direct velocity). Above navigation so agent
      # teleop overrides autonomous motion, below joystick/keyboard so a
      # local operator always wins. The agent's own safety layer (watchdog,
      # clamps, e-stop) sits upstream of this topic.
      agent:
        topic:    /cmd_vel_agent
        timeout:  0.5
        priority: 50
      joystick:
        topic:    /cmd_vel_joy
        timeout:  0.5
        priority: 100
      keyboard:
        topic:    /cmd_vel_key
        timeout:  0.5
        priority: 90

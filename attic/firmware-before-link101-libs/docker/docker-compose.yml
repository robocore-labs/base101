services:
  zenoh-axon:
    build:
      context: .
      # Match the firmware's vendored zenoh-pico version (see the Dockerfile).
      args:
        ZENOH_REF: "1.9.0"
    image: axon-zenohd
    container_name: axon-zenohd
    restart: unless-stopped

    # host networking so rmw_zenoh on the host reaches the router on tcp/7447
    # without extra port mapping. Drop this and use `ports: ["7447:7447"]`
    # if you prefer a bridged network.
    network_mode: host

    # Map the Axon zenoh serial port into the container. This relies on the
    # udev rule that creates /dev/axon-zenoh (see ../99-axon-devices.rules and
    # ../install.sh). If you don't have the symlink, point at the raw node:
    #   - "/dev/ttyACM0:/dev/axon-zenoh"
    devices:
      - "/dev/ttyACM0:/dev/axon-zenoh"

  # ROS 2 Jazzy test sidecar: rmw_zenoh client + rosboard web dashboard.
  # Connects to the router above (tcp/localhost:7447 via host networking) and
  # surfaces the firmware's topics. rosboard UI -> http://localhost:8888.
  #   docker compose up --build ros-sidecar          # dashboard
  #   docker compose run --rm ros-sidecar ros2 topic list
  #   docker compose run --rm ros-sidecar shell      # interactive ROS shell
  ros-sidecar:
    build:
      context: .
      dockerfile: ros/Dockerfile
    image: axon-ros-sidecar
    container_name: axon-ros-sidecar
    restart: unless-stopped
    depends_on:
      - zenoh-axon

    # host networking so it reaches the host-mode router on tcp/localhost:7447
    # and exposes the rosboard port (8888) directly on the host.
    network_mode: host

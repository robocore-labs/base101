# Minimal forge config for base101 on REAL HARDWARE: wheels + IMU + rosboard
# over zenoh, plus the lidar and camera drivers. Closest forge equivalent of
# docker/docker-compose.hw.yaml (same scope, same reasoning) — use that file
# for local dev on this machine; use this one to actually deploy to the robot.
#
# IMU needs no separate component — the Axon 2 firmware publishes
# /link101/imu* and /link101/odom/raw directly (both raw only — no fused
# odometry, no TF; a host-side EKF in `drive`'s robot.launch.py owns that —
# see HARDWARE.md's topic contract), so both are already on the wire inside
# `drive` (no /joint_states — the firmware doesn't publish one either).
# Lidar and camera are real sensor drivers, ported from the sibling
# (fuller, still-draft) hardware.yaml and pointed at zenoh instead of
# fastdds.
#
# STILL NO SLAM/NAV/AGENT AT RUNTIME — those stay off (nav:=false slam:=false
# agent:=false below) until base101_slam/base101_nav are actually exercised
# against real lidar+odom; see hardware.yaml for where agent would go.
#
# Project root is bpe/ (this file lives under robots/base101/, one level
# down), because base101_bringup_hw's package.xml unconditionally
# exec_depends on base101_slam, base101_nav AND robocore_agent — forge's
# rosdep step resolves every declared dependency of every package it's given,
# and a dependency it can neither find under `source:` nor look up as a
# system package (all three are private, unregistered package names) is a
# hard error. So base101_slam/base101_nav/robocore_agent below are BUILT,
# not launched (nav:=false slam:=false agent:=false in the entrypoint) —
# this is forced by that dependency graph, not a scope choice. The same
# constraint hit docker-compose.hw.yaml's `ws` service; see its comment.
#
#   cd ~/Work/bpe
#   forge -p . -f robots/base101/hardware.drive.yaml validate
#   forge -p . -f robots/base101/hardware.drive.yaml prep && \
#   forge -p . -f robots/base101/hardware.drive.yaml stage && \
#   forge -p . -f robots/base101/hardware.drive.yaml build && \
#   forge -p . -f robots/base101/hardware.drive.yaml launch
#
# One-time prerequisite forge does NOT do for you: build the zenoh router
# image below (it compiles zenohd from source with the transport_serial
# feature the stock eclipse/zenoh image lacks). It's referenced here purely
# by local image name/tag — never pulled from `registry:` — so build it on
# whichever host actually runs the router (the `robot` host, since
# build_on_device is set there):
#
#   ssh cdr@base101.local
#   cd <wherever base101 is checked out on the robot>/firmware/docker
#   docker build -t axon-zenohd:latest --build-arg ZENOH_REF=1.9.0 .
#
# (Same Dockerfile docker-compose.hw.yaml's zenoh-axon service builds — see
# firmware/docker/README.md.)

ros_distro: jazzy
ros_domain_id: 0
registry: dragomirxyz
image_prefix: base101_drive
deploy_mode: transfer 

# The board talks zenoh over its USB-serial zenoh-pico link (see
# HARDWARE.md), not multicast DDS, so this has to be zenoh — fastdds has no
# way to reach it. router_command is REQUIRED here: forge's default router
# command is `--listen tcp/0.0.0.0:<port>`, which would override the image's
# own `-c /etc/zenoh/serial.json5` CMD and silently drop the serial listen
# endpoint, leaving the router deaf to the board.
rmw_implementation: zenoh
zenoh:
  router_image: axon-zenohd:latest
  router_port: 7447
  router_command: "-c /etc/zenoh/serial.json5"
  # Requires the udev symlink from firmware/install.sh on the robot host. No
  # symlink yet? Map the raw node instead: "/dev/ttyACM0:/dev/axon-zenoh" — but
  # prefer the symlink: a raw ttyACM* node isn't stable across a board reset
  # (RP2354 USB CDC re-enumerates), so a container holding one open can dangle
  # on a device that no longer exists, or worse, silently attach to whatever
  # unrelated device claims that number next.
  router_devices:
    - "/dev/link101-zenoh:/dev/axon-zenoh"

hosts:
  # PLACEHOLDER — same as the fuller hardware.yaml draft: confirm the
  # hostname/user before the first deploy. build_on_device is deliberate:
  # native ARM builds beat QEMU emulation, and the robot is the only ARM
  # machine in the loop.
  - name: robot
    ip: orin.lan
    user: cdr
    arch: arm64
    manager: true
    mount_root: /home/cdr/robocore-deploy

components:

  # robot_state_publisher + twist_mux + rosboard. No ros2_control here: the
  # Axon firmware owns the whole control loop itself (locomotion, odometry)
  # and talks ROS topics directly over the zenoh router above — see
  # HARDWARE.md. base101_slam/base101_nav/robocore_agent are built
  # (package.xml forces it — see file header) but never launched.
  - name: drive
    runs_on: robot

    source:
      - src/base101/base101_description
      - src/base101/base101_control
      - src/base101/base101_time
      - src/base101/base101_bringup_hw
      - src/base101/base101_slam    # unused; see file header
      - src/base101/base101_nav     # unused; see file header
    ports:
      - "8888:8888"   # rosboard: http://<robot host>:8888
    # forge's zenoh template already sets ZENOH_CONFIG_OVERRIDE for the
    # listen/connect endpoints; this duplicate entry appends
    # transport/shared_memory/enabled=false (docker's last-value-wins on
    # repeated env keys). Same fix the firmware's own ros-sidecar needed
    # (firmware/docker/ros/session.json5) — rmw_zenoh's default SHM provider
    # fails to allocate inside a container ("Unable to create POSIX shm
    # segment: OS error 12"), and here there's no bind-mounted config file to
    # set it in directly.
    repositories:
      - url: https://github.com/cristidragomir97/rosboard-with-extras
        version: main             # TODO(verify): jazzy branch if published
    environment:
      ZENOH_CONFIG_OVERRIDE: >-
        listen/endpoints=["tcp/0.0.0.0:0"];connect/endpoints=["tcp/zenoh_router:7447"];transport/shared_memory/enabled=false
    entrypoint: >-
      ros2 launch base101_bringup_hw robot.launch.py
      camera:=oak_d nav:=true slam:=true agent:=false rosboard:=true

  # RPLidar C1, wired to the host's UART GPIO port rather than over USB —
  # there's no USB-serial adapter in the way, so this is the raw ttyAMA0
  # device straight into rplidar_ros. -> /scan_filtered (self-filtered — see
  # base101_lidar/README.md), frame lidar_frame.
  # TODO(verify): the C1's default baud rate (typically 460800) assumes a
  # USB-serial adapter's clock; confirm it holds on the SoC's own UART, and
  # that nothing else on this host claims ttyAMA0 (it's often the console
  # UART on RPi-class boards — check /boot config before wiring).
  - name: lidar
    runs_on: robot
    source:
      - src/base101/base101_lidar
    repositories:
      # rplidar_ros isn't a rosdep-resolvable package name; base101_lidar
      # exec_depends on it, so forge still needs it fetched here — same
      # reasoning as the `source:`/`repositories:` split noted in this
      # file's header for base101_slam/base101_nav/robocore_agent.
      - url: https://github.com/Slamtec/rplidar_ros
        version: ros2
    devices:
      - "/dev/ttyCH341USB0:/dev/rplidar"
    environment:
      ZENOH_CONFIG_OVERRIDE: >-
        listen/endpoints=["tcp/0.0.0.0:0"];connect/endpoints=["tcp/zenoh_router:7447"];transport/shared_memory/enabled=false
    entrypoint: >-
      ros2 launch base101_lidar lidar.launch.py
      serial_port:=/dev/rplidar frame_id:=lidar_frame serial_baudrate:=460800
  # Luxonis OAK-D on the front bracket, matching camera:=oak_d above.
  #
  # USB passthrough is broad on purpose: the OAK-D re-enumerates as a
  # different USB address when it switches from bootloader to runtime, so
  # pinning one /dev/bus/usb/NNN/NNN path breaks on every power cycle.
  #
  # TODO(verify): confirm the driver stamps camera_optical_frame and
  # publishes under /oak — base101_arm_hw.yaml's camera topics assume both.
  #
  # v3-jazzy, not humble: the humble branch doesn't declare cv_bridge as a
  # rosdep-resolvable dependency on Jazzy (build failed with
  # "cv_bridge/cv_bridge.h: No such file or directory" — see luxonis's own
  # Jazzy build docs). Jazzy needs BOTH depthai-core and depthai-ros checked
  # out at v3-jazzy, and the v3 packages are suffixed _v3
  # (depthai_ros_driver_v3, not depthai_ros_driver).
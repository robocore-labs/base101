

ros_distro: jazzy
ros_domain_id: 0
registry: dragomirxyz
image_prefix: base101

# Without this, forge defaults to fastdds (core/config.py's is_zenoh checks
# this value, not just whether a `zenoh:` block is present) — regenerates
# docker-compose.yml with RMW_IMPLEMENTATION=rmw_fastrtps_cpp and a
# dds_server/discovery-server component instead of a zenoh_router, which is
# incompatible with the Axon 2/link101 firmware: it's a native rmw_zenoh
# node (Pico-ROS + zenoh-pico), not a plain DDS participant — see
# HARDWARE.md's "export RMW_IMPLEMENTATION=rmw_zenoh_cpp" host setup step.
rmw_implementation: zenoh

zenoh:
  router_image: axon-zenohd:latest
  router_port: 7447
  router_command: "-c /etc/zenoh/serial.json5"
  # NOT router_devices: a fixed device mapping resolves to the current
  # major/minor at container start, so a Link101 USB re-enumeration (host
  # udev updates /dev/link101-zenoh to point at the new ttyACM index) leaves
  # a running container holding the stale character device. Mounting the
  # whole host /dev tree instead means the container always resolves the
  # symlink live. `c 166:*` is the USB ACM (cdc_acm) major device number —
  # `rmw` (read/mknod/write) lets the router open whichever ttyACM node the
  # symlink currently targets without being privileged.
  router_docker:
    volumes:
      - "/dev:/host-dev"
    device_cgroup_rules:
      - "c 166:* rmw"

hosts:
  - name: robot
    ip: orin.lan
    user: cdr
    arch: arm64
    manager: true
    mount_root: /home/cdr/robocore-deploy

components:
  - name: drive
    runs_on: robot
    source:
      - src/base101/base101_description
      - src/base101/base101_control
      - src/base101/base101_time
      - src/base101/base101_bringup_hw
    ports:
      - "8888:8888"
    repositories:
      - url: https://github.com/cristidragomir97/rosboard-with-extras
        version: main             # TODO(verify): jazzy branch if published
    environment:
      ZENOH_CONFIG_OVERRIDE: >-
        listen/endpoints=["tcp/0.0.0.0:0"];connect/endpoints=["tcp/zenoh_router:7447"];transport/shared_memory/enabled=false
    entrypoint: >-
      ros2 launch base101_bringup_hw robot.launch.py
      camera:=realsense rosboard:=true

  - name: autonomy
    runs_on: robot
    source:
      - src/base101/base101_autonomy
      - src/base101/base101_slam
      - src/base101/base101_nav
    environment:
      ZENOH_CONFIG_OVERRIDE: >-
        listen/endpoints=["tcp/0.0.0.0:0"];connect/endpoints=["tcp/zenoh_router:7447"];transport/shared_memory/enabled=false
    entrypoint: ros2 launch base101_autonomy autonomy.launch.py

  - name: lidar
    runs_on: robot
    source:
      - src/base101/base101_lidar
    repositories:
      - url: https://github.com/Slamtec/rplidar_ros
        version: ros2
    devices:
      - "/dev/ttyCH341USB0:/dev/rplidar"
    environment:
      ZENOH_CONFIG_OVERRIDE: >-
        listen/endpoints=["tcp/0.0.0.0:0"];connect/endpoints=["tcp/zenoh_router:7447"];transport/shared_memory/enabled=false
    entrypoint: >-
      ros2 launch base101_lidar lidar.launch.py
      serial_port:=/dev/rplidar frame_id:=lidar_frame serial_baudrate:=460800

  - name: camera
    runs_on: robot
    privileged: true
    source:
      - src/base101/base101_camera
    devices:
      - /dev/bus/usb:/dev/bus/usb
    entrypoint: ros2 launch base101_camera camera.launch.py

  # Not a ROS component — see docker/zenoh-watcher/. Restarts zenoh_router
  # when /dev/link101-zenoh's target changes (board re-enumeration after a
  # watchdog reboot): the router's `router_docker` volume mount above keeps
  # the symlink resolution live, but zenohd itself still holds the fd to
  # whatever device it opened at startup until restarted — nothing else
  # prompts that restart. See HARDWARE.md's "Host one-time setup" step 3.
  - name: zenoh_watcher
    runs_on: robot
    build: docker/zenoh-watcher
    volumes:
      - "/dev:/watch-dev:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    entrypoint: /watch.sh
